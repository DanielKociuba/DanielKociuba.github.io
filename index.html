<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0b">
<title>Daniel — Links</title>
<style>
  :root {
    --bg: #090909;
    --card: #111111;
    --text: #f5f5f5;
    --muted: #8f8f8f;
    --line: #343434;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 18%, #191919 0, #0c0c0c 34%, #070707 72%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI",
                 Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 620px;
    min-height: 100vh;
    padding: 58px 22px 44px;
    display: flex;
    flex-direction: column;
  }

  .profile {
    text-align: center;
  }

  .avatar {
    width: 126px;
    height: 126px;
    margin: 0 auto 25px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid #777;
    box-shadow: 0 0 0 5px rgba(255,255,255,.025);
    background: #151515;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 52% 43%;
    display: block;
  }

  h1 {
    margin: 0;
    font-size: clamp(30px, 7vw, 42px);
    line-height: 1;
    font-weight: 500;
    letter-spacing: .38em;
    padding-left: .38em;
  }

  .divider {
    width: 45px;
    height: 1px;
    background: #dedede;
    margin: 22px auto 18px;
  }

  .tagline {
    margin: 0 0 42px;
    color: var(--muted);
    font-size: 12px;
    letter-spacing: .34em;
    padding-left: .34em;
    text-transform: uppercase;
  }

  .links {
    display: grid;
    gap: 14px;
  }

  .link {
    min-height: 68px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(18,18,18,.72);
    color: var(--text);
    text-decoration: none;
    display: grid;
    grid-template-columns: 58px 1fr 30px;
    align-items: center;
    padding: 0 23px;
    transition: transform .18s ease, border-color .18s ease,
                background .18s ease, box-shadow .18s ease;
    backdrop-filter: blur(10px);
  }

  .link:hover {
    transform: translateY(-2px);
    border-color: #5a5a5a;
    background: rgba(28,28,28,.9);
    box-shadow: 0 12px 35px rgba(0,0,0,.25);
  }

  .link:active { transform: scale(.985); }

  .icon {
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    justify-self: start;
    color: #f2f2f2;
  }

  .icon svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .label {
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .30em;
    padding-left: .30em;
  }

  .arrow {
    font-size: 25px;
    font-weight: 300;
    line-height: 1;
    justify-self: end;
    color: #dedede;
  }

  footer {
    margin-top: auto;
    padding-top: 62px;
    text-align: center;
    color: #747474;
  }

  .mountains {
    width: 94px;
    height: 30px;
    margin: 0 auto 13px;
    position: relative;
  }

  .mountains::before,
  .mountains::after {
    content: "";
    position: absolute;
    top: 15px;
    width: 30px;
    height: 1px;
    background: #454545;
  }

  .mountains::before { left: 0; }
  .mountains::after { right: 0; }

  .mountain-mark {
    position: absolute;
    left: 50%;
    top: 2px;
    transform: translateX(-50%);
    color: #777;
    font-size: 22px;
    line-height: 1;
  }

  .footer-text {
    margin: 0;
    font-size: 10px;
    letter-spacing: .34em;
    padding-left: .34em;
    text-transform: uppercase;
  }

  @media (max-width: 480px) {
    .page { padding-top: 45px; }
    .avatar { width: 112px; height: 112px; margin-bottom: 23px; }
    .tagline { margin-bottom: 34px; font-size: 10px; }
    .link { min-height: 62px; padding: 0 19px; grid-template-columns: 48px 1fr 25px; }
    .label { font-size: 12px; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="profile">
    <div class="avatar">
      <img src="profile.jpg" alt="Daniel outdoors">
    </div>

    <h1>DANIEL</h1>
    <div class="divider"></div>
    <p class="tagline">Personal links &amp; socials</p>
  </section>

  <nav class="links" aria-label="Social links">

    <a class="link" href="https://www.instagram.com/daniel._k_/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4.2"></circle>
          <circle cx="17.4" cy="6.7" r="1"></circle>
        </svg>
      </span>
      <span class="label">INSTAGRAM</span>
      <span class="arrow">→</span>
    </a>

    <a class="link" href="https://www.tiktok.com/@daniel._k_" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M14.5 4v9.1a4.4 4.4 0 1 1-3.3-4.25"></path>
          <path d="M14.5 4c.55 2.1 1.8 3.45 4 3.85"></path>
        </svg>
      </span>
      <span class="label">TIKTOK</span>
      <span class="arrow">→</span>
    </a>

    <a class="link" href="https://www.snapchat.com/add/dkociuba11?share_id=M6C0JJWlTByLPT4e_f4hQA&locale=en_CA" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 3.5c-3.2 0-5.2 2.3-5.2 5.6v2.3c0 .7-.4 1.1-1.2 1.4-.5.2-.7.6-.3 1 .5.5 1.3.7 2 .8.2.9.8 1.5 1.6 1.8-.1.8.2 1.1.8 1.1.8 0 1.3-.5 2.3-.5s1.5.5 2.3.5c.6 0 .9-.3.8-1.1.8-.3 1.4-.9 1.6-1.8.7-.1 1.5-.3 2-.8.4-.4.2-.8-.3-1-.8-.3-1.2-.7-1.2-1.4V9.1c0-3.3-2-5.6-5.2-5.6Z"></path>
        </svg>
      </span>
      <span class="label">SNAPCHAT</span>
      <span class="arrow">→</span>
    </a>

  </nav>

  <footer>
    <div class="mountains"><span class="mountain-mark">⌃</span></div>
    <p class="footer-text">Life's better outside</p>
  </footer>
</main>
</body>
</html>
